name: foundation_stereo
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu129
    - torch==2.8.0+cu129
    - torchvision==0.23.0+cu129
    - torchaudio==2.8.0+cu129
    - scikit-image
    - omegaconf
    - opencv-contrib-python
    - imgaug
    - ninja
    - timm
    - albumentations
    - jupyterlab
    - scipy
    - pandas
    - joblib
    - scikit-learn
    - ruamel.yaml
    - trimesh
    - pyyaml
    - imageio
    - open3d
    - transformations
    - einops
    - gdown
    - nodejs
    # optional: flash-attn==2.8.2 (xformers 0.0.32 rejects >2.8.2), no prebuilt wheel for torch 2.8 so it must be built from source
    - xformers==0.0.32.post2
    - huggingface-hub
